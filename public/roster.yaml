##############################################################
#### Merged MULTI-TENANT roster (Feb–Apr + Aug–Oct 2026)  ####
##############################################################
#
# One tenant ("Media Team") whose "Video" team owns TWO rosters — the Feb–Apr
# and the Aug–Oct 2026 quarters — merged from the two flat files
# (roster_feb_apr_26_v1_1.yaml + roster_aug_oct_26_v1.yaml). Because a team's
# `roles` catalog + `team_members` (capability) are SHARED across its rosters,
# the two periods are reconciled as follows:
#
#   * Role catalog is unified: the old cam-1 → main-cam, and cam-2/cam-3 →
#     roving-cam. The catalog is therefore multi-vm / vm / main-cam / roving-cam.
#   * The member registry is the UNION of both periods (identity + GLOBAL
#     unavailability + notes). Dates outside a roster's period simply don't
#     apply, so a single global list is safe.
#   * `team_members.include` is the DEFAULT active status. Where a member's
#     active status differs in a period, the roster carries a per-roster
#     `member_overrides: [{ member_id, include }]` that wins for that roster
#     (see specs/multi-tenant.md — resolver `member_overrides`).
#
# A few example OTHER teams (Projectionist / Coffee / Children's) are included so
# the members-view "Also on" line and the team dropdown have something to show
# (e.g. Rystine is also on Projectionist, Viv on Coffee, Rasey on Children's).

tenant:
  name: "Media Team"

########################################
#### Tenant-level member registry   ####
