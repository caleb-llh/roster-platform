#################################
#### Define the roster scope ####
#################################

# The roster period defines the date range for scheduling
roster_period:
  start_date: "2026-02-01"  # First day of the roster period
  end_date: "2026-03-31"     # Last day of the roster period

# Define all roles that need to be filled in events
roles:
  - name: lead      # Primary role - leads the event
  - name: support   # Supporting role - assists the lead
  - name: backup    # Backup role - covers when others are unavailable

###########################
#### Define the supply ####
###########################

# List all team members who can be assigned to events
# Fields:
#   id: unique identifier (used in constraints/preferences/events)
#   name: full display name
#   telegram: Telegram handle for notifications
#   include: whether to include in automatic roster generation
#   roles: list of roles this member can perform. Each entry is an object:
#          - name: <role>                 # a role the member can FULLY perform
#          - name: <role>                 # a role the member is TRAINING for;
#            understudy: true             #   they must shadow it before performing

members:
  - id: member-1-alice
    name: Alice Johnson
    telegram: "@alice"
    include: true    # Include in roster generation
    roles:
      - name: lead         # Can perform all three roles
      - name: support
      - name: backup
  
  - id: member-2-bob
    name: Bob Smith
    telegram: "@bob"
    include: true
    roles:
      - name: lead         # Can perform lead and support
      - name: support
  
  - id: member-3-charlie
    name: Charlie Davis
    telegram: "@charlie"
    include: true
    roles:
      - name: support      # Can perform support; training for lead
      - name: lead         # Understudy: must shadow `lead` before performing it
        understudy: true
  
  - id: member-4-diana
    name: Diana Lee
    telegram: "@diana"
    include: true
    roles:
      - name: support
      - name: backup
  
  - id: member-5-ethan
    name: Ethan Brown
    telegram: "@ethan"
    include: false   # Not included in roster generation (inactive)
    roles:
      - name: backup

###########################
#### Define the demand ####
###########################

# List all events that need roster assignments
# Fields:
#   name: descriptive name of the event
#   date: event date (YYYY-MM-DD format)
#   day_of_week: day of the week
#   reporting_time: when members should arrive (24-hour format HH:MM)
#   slots: list of roles and assigned member IDs (leave member_id empty for unassigned)
#   reminder: optional message sent to assigned members

events:
  - name: "Weekend Service"
    date: "2026-02-07"
    day_of_week: "Saturday"
    reporting_time: "2:00 PM"
    slots:
      - role: lead
        member_id:           # Leave empty for automatic assignment
      - role: support
        member_id:
    reminder: "Remember to arrive 30 minutes early."
  
  - name: "Weekend Service"
    date: "2026-02-08"
    day_of_week: "Sunday"
    reporting_time: "9:00 AM"
    slots:
      - role: lead
        member_id: 
    reminder: "Check equipment before starting."

  - name: "Weekend Service"
    date: "2026-02-14"
    day_of_week: "Saturday"
    reporting_time: "2:00 PM"
    slots:
      - role: lead
        member_id: 
      - role: support
        member_id:
  
  - name: "Weekend Service"
    date: "2026-02-15"
    day_of_week: "Sunday"
    reporting_time: "9:00 AM"
    slots:
      - role: lead
        member_id: member-1-alice  # Pre-assigned to Alice
  
  - name: "Weekend Service"
    date: "2026-02-28"
    day_of_week: "Saturday"
    reporting_time: "2:00 PM"
    slots:
      - role: lead
        member_id:
      - role: support
        member_id:
  
  - name: "Weekend Service"
    date: "2026-03-01"
    day_of_week: "Sunday"
    reporting_time: "9:00 AM"
    # Optional explicit datetime range. When omitted, the whole day is used.
    # Two events on the same day only clash if their [start, end) ranges overlap,
    # so this morning service and the evening one below can share a member.
    start: "2026-03-01T09:00"
    end: "2026-03-01T11:00"
    slots:
      - role: lead
        member_id:

  - name: "Evening Service"
    date: "2026-03-01"
    day_of_week: "Sunday"
    reporting_time: "6:00 PM"
    start: "2026-03-01T18:00"
    end: "2026-03-01T20:00"
    slots:
      - role: lead
        member_id:

# NOTE: Roster-level constraints (hard rules) and preferences (soft goals) are
# now built into the app as source-code defaults, so you don't need to declare
# them here. Sensible defaults are applied automatically.
#
# If you want to OVERRIDE a default for this roster, uncomment and set only the
# keys you want to change, e.g.:
#
#   roster_constraints:
#     MAX_ASSIGNMENTS_PER_MONTH: 3
#
#   roster_preferences:
#     AVOID_CONSECUTIVE_WEEKS: false

#####################################################################
#### Constraints at the member level (overrides roster level) ####
#####################################################################

# Member-specific HARD constraints (override roster-level settings)
# Use this to mark when members are unavailable
# Formats:
#   Single date: "YYYY-MM-DD"
#   Date range:
#     start: "YYYY-MM-DD"
#     end: "YYYY-MM-DD"

member_constraints: 
  - member_id: member-2-bob
    unavailable_dates:
      - "2026-02-14"         # Single unavailable date
      - "2026-02-15"         # Another single date
  
  - member_id: member-3-charlie
    unavailable_dates:
      - start: "2026-02-21"  # Date range - unavailable from Feb 21-28
        end: "2026-02-28"
  
  - member_id: member-4-diana
    unavailable_dates:
      - start: "2026-03-05"  # Date range - unavailable from Mar 5-10
        end: "2026-03-10"

##################################################################
#### Preferences at the member level (overrides roster level) ####
##################################################################

# Member-specific SOFT preferences (overrides roster-level settings)
# Use this to indicate preferred days for assignment
# The generator will try to honor these when possible

member_preferences: 
  - member_id: member-1-alice
    days:
      - Sunday             # Prefers Sunday assignments
  
  - member_id: member-4-diana
    days:
      - Saturday           # Prefers Saturday assignments
    roles:
      - support            # Prefers support role
